<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spam Email Classifier</title>
  <style>
    body { width: 360px; font-family: Arial, sans-serif; padding: 14px; margin: 0; }
    h3 { margin: 0 0 10px; }
    textarea { width: 100%; height: 140px; box-sizing: border-box; padding: 8px; resize: vertical; }
    button { margin-top: 8px; width: 100%; padding: 9px; cursor: pointer; border: 0;
             border-radius: 6px; background: #1a73e8; color: #fff; font-size: 14px; }
    button:disabled { opacity: .6; cursor: default; }
    #result { margin-top: 12px; padding: 10px; border-radius: 6px; font-weight: bold;
              display: none; }
    #result.spam { background: #fce8e6; color: #c5221f; }
    #result.ham { background: #e6f4ea; color: #137333; }
    #result.err { background: #fef7e0; color: #b06000; font-weight: normal; }
    details { margin-top: 12px; font-size: 12px; color: #555; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 6px; }
    .small { margin-top: 6px; padding: 6px; font-size: 12px; background: #5f6368; }
  </style>
</head>
<body>
  <h3>📧 Spam Email Classifier</h3>
  <textarea id="text" placeholder="Paste email content here..."></textarea>
  <button id="btn">Classify</button>
  <div id="result"></div>

  <details>
    <summary>Server settings</summary>
    <input type="text" id="apiBase" placeholder="http://localhost:8000">
    <button class="small" id="save">Save</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
